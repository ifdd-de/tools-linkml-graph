[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkml-graph-explorer"
version = "0.1.3"
description = "Render LinkML instance data as documents (linkml-renderer) and as standalone interactive exploration graphs (Cytoscape.js), driven entirely by the schema and a separate visualization configuration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "linkml-graph-explorer contributors" }]
keywords = ["linkml", "graph", "visualization", "cytoscape", "json-ld"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "linkml-runtime>=1.7",
    "linkml-renderer>=0.3.1",
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "linkml>=1.7"]

[project.scripts]
graph-explorer = "linkml_graph_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkml_graph_explorer = ["template.html", "vendor/*", "locale/**/*.mo", "locale/**/*.po", "locale/*.pot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
